name: Local RAG Vector Integration
on:
  push:
    paths:
      - 'app/rag.py'
      - 'app/main.py'
      - 'app/policies.py'
      - 'tests/conftest.py'
      - 'tests/test_vector_integration.py'
      - '.github/workflows/vector-integration.yml'
      - 'requirements-rag.txt'
      - 'requirements.txt'
  pull_request:
    paths:
      - 'app/rag.py'
      - 'app/main.py'
      - 'app/policies.py'
      - 'tests/conftest.py'
      - 'tests/test_vector_integration.py'
      - '.github/workflows/vector-integration.yml'
      - 'requirements-rag.txt'
      - 'requirements.txt'
jobs:
  vector-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ChromaDB without downloading embedding model
        run: pip install -r requirements.txt 'chromadb>=0.5,<2' 'numpy>=1.26,<3'
      - name: Run offline vector integration tests
        run: python -m pytest -q tests/test_vector_integration.py
