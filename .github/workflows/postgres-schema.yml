name: PostgreSQL Schema Integration
on: [push, pull_request]
jobs:
  postgres-schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: school_test
          POSTGRES_PASSWORD: school_test_only
          POSTGRES_DB: school_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U school_test -d school_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt 'psycopg[binary]>=3.2,<4'
      - run: python -m pytest -q tests/test_postgres_schema.py
        env:
          TEST_POSTGRES_URL: postgresql://school_test:school_test_only@localhost:5432/school_test
      - run: python -m pytest -q tests/test_postgres_adapter_integration.py
        env:
          TEST_POSTGRES_URL: postgresql://school_test:school_test_only@localhost:5432/school_test
      - run: python -m pytest -q tests/test_postgres_bootstrap.py
        env:
          TEST_POSTGRES_URL: postgresql://school_test:school_test_only@localhost:5432/school_test

      - name: Restricted runtime permissions and versioned migrations
        run: python -m pytest -q tests/test_postgres_runtime_role.py tests/test_postgres_migrations.py
        env:
          TEST_POSTGRES_URL: postgresql://school_test:school_test_only@localhost:5432/school_test

      - name: PostgreSQL migration and real backup restore drill
        run: python -m pytest -q tests/test_postgres_migration_restore_integration.py
        env:
          TEST_POSTGRES_URL: postgresql://school_test:school_test_only@localhost:5432/school_test

      - name: FastAPI PostgreSQL HTTP integration
        run: python -m pytest -q tests/test_postgres_fastapi_integration.py
        env:
          TEST_POSTGRES_URL: postgresql://school_test:school_test_only@localhost:5432/school_test
