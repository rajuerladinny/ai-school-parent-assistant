services:
  - type: web
    name: school-parent-assistant-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: SCHOOL_ADMIN_KEY
        generateValue: true
      - key: SCHOOL_DB
        value: /tmp/school-demo.db
      - key: RAG_VECTOR_PATH
        value: /tmp/school-chroma
